<template id="power-lora-item">
  <div class="d-flex w-100 align-items-center gap-1">
    <span class="comfygrid-lora-handle" aria-label="Drag to reorder">
      <i class="icon-grip-horizontal"></i>
    </span>
    <input class="form-check-input m-0" type="checkbox" data-role="toggle" />
    <cg-modal-combo-widget data-role="combo" model-dir="models" model-subdirs="loras" style="min-width: 0; flex: 1"></cg-modal-combo-widget>
    <input class="form-control" style="width: 4.8rem" type="number" step="0.05" data-role="strength" />
    <button class="remove-btn btn btn-sm p-0" data-role="remove" aria-label="Remove LoRA">
      <i class="icon-x"></i>
    </button>
  </div>
</template>
