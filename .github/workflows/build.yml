name: Build and Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
        working-directory: frontend

      - name: Build frontend
        run: pnpm run build
        working-directory: frontend

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .

      - name: Assemble Portable Release Folder
        shell: cmd
        run: |
          mkdir release_portable
          copy Caddyfile release_portable\
          copy main.py release_portable\
          copy pyproject.toml release_portable\
          copy README.md release_portable\
          copy run.bat release_portable\
          xcopy comfygrid release_portable\comfygrid /E /I /Q
          xcopy config release_portable\config /E /I /Q
          xcopy frontend\dist release_portable\frontend\dist /E /I /Q
          xcopy hook release_portable\hook /E /I /Q
          if exist "extensions\" xcopy extensions release_portable\extensions /E /I /Q
          if exist "modules\" xcopy modules release_portable\modules /E /I /Q
          if exist "release_portable\frontend\dist\THIRD_PARTY_LICENSES.txt" move release_portable\frontend\dist\THIRD_PARTY_LICENSES.txt release_portable\
          python -c "import json; from pathlib import Path; from comfygrid.services.git import get_version_info; Path('release_portable/version.json').write_text(json.dumps(get_version_info(), ensure_ascii=False), encoding='utf-8')"

      - name: Create zip archives
        run: |
          Compress-Archive -Path release_portable\* -DestinationPath ComfyGrid-portable-${{ github.ref_name }}.zip
          Compress-Archive -Path frontend\dist -DestinationPath frontend-dist-${{ github.ref_name }}.zip

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ComfyGrid-builds-${{ github.ref_name }}
          path: |
            ComfyGrid-portable-${{ github.ref_name }}.zip
            frontend-dist-${{ github.ref_name }}.zip

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ComfyGrid-portable-${{ github.ref_name }}.zip
            frontend-dist-${{ github.ref_name }}.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
