[ComfyGrid.ui.language]
type = "dropdown"
choices = ["auto", "en", "ja"]
default = "auto"

[ComfyGrid.ui.show_nsfw]
type = "checkbox"
default = true

[ComfyGrid.ui.model_tree_view]
type = "checkbox"
default = true

[ComfyGrid.ui.node_color]
type = "radio"
default = "group"
choices = ["none", "node", "group", "node_priority"]

[ComfyGrid.ui.group_tabify]
type = "dropdown"
choices = ["none", "all_top_groups"]
default = "all_top_groups"

[ComfyGrid.ui.common_tab_board]
type = "checkbox"
default = true

[ComfyGrid.ui.always_show_node_focus_button]
type = "checkbox"
default = false

[ComfyGrid.ui.simple_node_mode]
type = "checkbox"
default = false

[ComfyGrid.ui.model_thumbnail_width]
type = "slider"
default = "160"
minimum = "128"
maximum = "256"
step = "8"

[ComfyGrid.ui.gallery_image_max_size]
type = "slider"
default = "448"
minimum = "256"
maximum = "768"
step = "8"

[ComfyGrid.ui.system_monitor]
type = "radio"
default = "top"
choices = ["none", "top", "left"]

[ComfyGrid.theme.color_theme]
type = "dropdown"
choices = ["auto", "light", "dark"]
default = "auto"

[ComfyGrid.system_monitor.cpu]
type = "checkbox"
default = true

[ComfyGrid.system_monitor.ram]
type = "checkbox"
default = true

[ComfyGrid.system_monitor.gpu]
type = "checkbox"
default = true

[ComfyGrid.system_monitor.vram]
type = "checkbox"
default = true

[ComfyGrid.system_monitor.temp]
type = "checkbox"
default = true

[ComfyGrid.save.directory]
type = "text"
default = "save"

[ComfyGrid.save.create_subdirectory]
type = "checkbox"
default = true

[ComfyGrid.save.subdirectory_name_format]
type = "text"
default = "{date}"

[ComfyGrid.save.image_filename_format]
type = "text"
default = "[{ckpt_name}]_{datetime}_({seed})"

[ComfyGrid.save.image_format]
type = "dropdown"
choices = ["original", "png", "webp", "jpeg", "jxl"]
default = "original"

[ComfyGrid.save.image_quality]
type = "slider"
default = "90"
minimum = "1"
maximum = "100"
step = "1"

[ComfyGrid.save.image_embed_metadata]
type = "checkbox"
default = true

[ComfyGrid.ollama.url]
type = "text"
default = "http://localhost:11434"

[ComfyGrid.ollama.model]
type = "text"
default = "llama3.1:8b"

[ComfyGrid.ollama.system]
type = "textarea"
default = "You are an AI artist."

[ComfyGrid.ollama.translate_timing]
type = "dropdown"
choices = ["on_generate", "on_blur", "manual"]
default = "on_generate"

[ComfyGrid.prompt_pilot.enabled]
type = "checkbox"
default = true

[ComfyGrid.prompt_pilot.tag_source]
type = "dropdown"
choices = ["danbooru.donmai.us", "e621.net", "all"]
default = "danbooru.donmai.us"

[ComfyGrid.prompt_pilot.post_count_threshold]
type = "slider"
default = "10"
minimum = "10"
maximum = "1000"
step = "10"

[ComfyGrid.prompt_pilot.max_results_group0]
type = "slider"
default = "30"
minimum = "0"
maximum = "100"
step = "5"

[ComfyGrid.prompt_pilot.max_results_group1]
type = "slider"
default = "10"
minimum = "0"
maximum = "100"
step = "5"

[ComfyGrid.prompt_pilot.max_results_group3]
type = "slider"
default = "10"
minimum = "0"
maximum = "100"
step = "5"

[ComfyGrid.prompt_pilot.max_results_group4]
type = "slider"
default = "10"
minimum = "0"
maximum = "100"
step = "5"

[ComfyGrid.prompt_pilot.max_results_group5]
type = "slider"
default = "10"
minimum = "0"
maximum = "100"
step = "5"

[ComfyGrid.prompt_pilot.max_results_groupcustom]
type = "slider"
default = "20"
minimum = "0"
maximum = "100"
step = "5"

[ComfyGrid.prompt_pilot.max_results_grouplora]
type = "slider"
default = "50"
minimum = "0"
maximum = "200"
step = "5"

[ComfyGrid.prompt_pilot.word_coloring]
type = "dropdown"
choices = ["none", "word", "category"]
default = "word"

[ComfyGrid.prompt_pilot.tag_delimiter]
type = "dropdown"
choices = ["auto", "space", "underscore"]
default = "auto"

[ComfyGrid.prompt_pilot.always_underscore_tags]
type = "textarea"
default = "score_9, score_8_up, score_8, score_7_up, score_7, score_6_up, score_6, score_5_up, score_5, score_4_up, score_4\nsource_pony, source_furry, source_cartoon, source_anime\nrating_safe, rating_questionable, rating_explicit"

[ComfyGrid.prompt_pilot.always_space_tags]
type = "textarea"
default = ""

